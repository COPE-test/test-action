name: tf-plan

on:
  pull_request:
    branches: [main]
    # re-run when the PR is opened, gets new commits, or its labels change
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  id-token: write   # OIDC to AWS
  contents: read

jobs:
  plan:
    uses: ./.github/workflows/terraform.yml
    with:
      command: plan
      labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}   # 'sandbox' or 'production'
