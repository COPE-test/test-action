name: tf-apply

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: github.event.pull_request.merged == true   # merged, not just closed
    uses: ./.github/workflows/terraform.yml
    with:
      command: apply
      labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}   # same label as the plan
